<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The secrets of Ancient Mayan Calendar</title>


    <!-- 引入 PWA Manifest 與設定主題色 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fafaf9">
    <link rel="apple-touch-icon" href="images/icon-192.png">

 


    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap');
        
        /* 設定中文字體，標題使用優雅的襯線體 (Serif) */
        .font-serif { font-family: 'Noto Serif TC', serif; }
        
        .fade-in { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 隱藏數字輸入框(number)預設的上下小箭頭 */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none; margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen font-sans antialiased selection:bg-amber-200 selection:text-stone-900">

    <!-- 頂部視覺橫幅 -->
     <header class="text-center p-8 pb-12 relative">
        <!-- <div class="mb-8 w-full max-w-2xl mx-auto overflow-hidden rounded-xl shadow-sm border border-stone-200">
             橫幅圖片，移除強烈的濾鏡，改用稍微柔和的呈現 
            <img src="https://placehold.co/800x300/e7e5e4/57534e?text=Mayan+Wisdom+Project" 
                 alt="馬雅曆法橫幅" 
                 class="w-full h-48 sm:h-56 object-cover opacity-90 hover:opacity-100 transition duration-700">
        </div>  -->
        <h1 class="text-4xl sm:text-5xl font-serif font-bold text-stone-800 mb-4 tracking-wider">
            The secrets of Ancient Mayan Calendar
        </h1>
        <p class="text-stone-500 max-w-lg mx-auto font-medium tracking-wide">探索您的卓爾金曆與哈布曆圖騰印記</p>
    </header>


    <main class="max-w-5xl mx-auto p-6 pb-16">
        
        <!-- 輸入區塊 -->
        <section class="bg-white rounded-2xl p-8 shadow-sm border border-stone-200 max-w-md mx-auto text-center mb-16 relative">
            <!-- 裝飾用小線條 -->
            <div class="w-12 h-1 bg-amber-700 mx-auto rounded-full mb-6"></div>
            
            <label class="block text-lg font-serif font-semibold text-stone-700 mb-6">請輸入出生日期</label>
            
            <!-- 獨立的「年、月、日」三個輸入框 -->
            <div class="flex items-center justify-center gap-3 mb-8">
                <div class="flex flex-col items-center">
                    <input type="number" id="birthYear" placeholder="YYYY" 
                           class="w-24 text-center bg-stone-50 text-stone-800 border border-stone-300 rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-700 focus:border-amber-700 transition shadow-inner" 
                           min="1900" max="2100">
                    <span class="text-stone-400 text-xs mt-2 font-medium">年</span>
                </div>
                
                <div class="flex flex-col items-center">
                    <input type="number" id="birthMonth" placeholder="MM" 
                           class="w-16 text-center bg-stone-50 text-stone-800 border border-stone-300 rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-700 focus:border-amber-700 transition shadow-inner" 
                           min="1" max="12">
                    <span class="text-stone-400 text-xs mt-2 font-medium">月</span>
                </div>
                
                <div class="flex flex-col items-center">
                    <input type="number" id="birthDay" placeholder="DD" 
                           class="w-16 text-center bg-stone-50 text-stone-800 border border-stone-300 rounded-lg p-3 focus:outline-none focus:ring-1 focus:ring-amber-700 focus:border-amber-700 transition shadow-inner" 
                           min="1" max="31">
                    <span class="text-stone-400 text-xs mt-2 font-medium">日</span>
                </div>
            </div>
            
            <button onclick="calculateMayan()" 
                    class="w-full bg-stone-800 hover:bg-stone-700 text-stone-50 font-medium py-3.5 px-6 rounded-lg shadow hover:shadow-md transition-all duration-300">
                開始計算
            </button>
            <p id="error-msg" class="text-red-600 text-sm mt-4 hidden bg-red-50 p-2 rounded border border-red-100">請填寫完整的年、月、日！</p>
        </section>

        <!-- 初始等待狀態 -->
        <div id="initial-state" class="text-center text-stone-400 py-12">
            <svg class="w-12 h-12 mx-auto mb-4 text-stone-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="font-serif tracking-wide text-stone-500">等待輸入日期，揭開您的個人圖騰</p>
        </div>

        <!-- 結果顯示區塊 -->
        <section id="result-section" class="hidden fade-in">
            <div class="grid md:grid-cols-2 gap-8 lg:gap-12">
                
                <!-- 卓爾金曆卡片 (Tzolkin) -->
                <div class="bg-white rounded-2xl p-8 lg:p-10 shadow-sm border border-stone-200 border-t-4 border-t-stone-700 relative">
                    <h3 class="text-2xl font-serif font-bold text-stone-800 flex items-center gap-3 mb-8 border-b border-stone-100 pb-4">
                        卓爾金曆 Cholq'ij
                        <span class="text-xs font-sans font-normal text-stone-500 ml-auto bg-stone-100 px-3 py-1 rounded-full border border-stone-200"></span>
                    </h3>
                    
                    <!-- 卓爾金曆圖騰圖片 -->
                    <div class="flex justify-center mb-10">
                        <img id="tz-glyph-img" src="" alt="卓爾金曆圖騰" 
                             class="w-32 h-32 rounded-full p-1 border-2 border-stone-200 shadow-sm object-cover bg-stone-50 hover:scale-105 transition-transform duration-500">
                    </div>
                    
                    <div class="space-y-1 mb-8">
                        <div class="flex justify-between items-center py-3 border-b border-stone-100">
                            <span class="text-stone-500 font-medium">圖騰</span>
                            <span class="text-stone-800 font-bold text-lg" id="tz-glyph"></span>
                        </div>
                        <div class="flex justify-between items-center py-3 border-b border-stone-100">
                            <span class="text-stone-500 font-medium">數字</span>
                            <span class="text-stone-800 font-bold text-lg" id="tz-tone"></span>
                        </div>
                    </div>
                    
                    <div class="mt-auto text-center bg-stone-50 p-5 rounded-xl border border-stone-200">
                        <p class="text-xs text-stone-500 mb-1 font-medium tracking-wide">您的卓爾金曆數字與圖騰組合</p>
                        <p class="text-xl font-bold text-stone-800" id="tz-summary"></p>
                    </div>
                </div>

                <!-- 哈布曆卡片 (Haab') -->
                <div class="bg-white rounded-2xl p-8 lg:p-10 shadow-sm border border-stone-200 border-t-4 border-t-amber-700 relative">
                    <h3 class="text-2xl font-serif font-bold text-stone-800 flex items-center gap-3 mb-8 border-b border-stone-100 pb-4">
                        哈布曆 Haab'
                        <span class="text-xs font-sans font-normal text-amber-700 ml-auto bg-amber-50 px-3 py-1 rounded-full border border-amber-100"></span>
                    </h3>
                    
                    <!-- 哈布曆圖騰圖片 (並排顯示 月圖騰 與 日圖騰) -->
                    <div class="flex justify-center items-center gap-6 sm:gap-10 mb-10">
                        <!-- 月圖騰 -->
                        <div class="flex flex-col items-center group">
                            <img id="haab-month-img" src="" alt="哈布曆月圖騰" 
                                 class="w-24 h-24 sm:w-28 sm:h-28 rounded-full p-1 border-2 border-stone-200 shadow-sm object-cover bg-stone-50 mb-3 group-hover:scale-105 transition-transform duration-500">
                            <span class="text-xs text-stone-600 font-medium tracking-wider">月圖騰</span>
                        </div>

                        <!-- 裝飾分隔點 -->
                        <div class="w-1.5 h-1.5 bg-stone-300 rounded-full"></div>

                        <!-- 日圖騰 -->
                        <div class="flex flex-col items-center group">
                            <img id="haab-glyph-img" src="" alt="哈布曆日圖騰" 
                                 class="w-24 h-24 sm:w-28 sm:h-28 rounded-full p-1 border-2 border-stone-200 shadow-sm object-cover bg-stone-50 mb-3 group-hover:scale-105 transition-transform duration-500">
                            <span class="text-xs text-stone-600 font-medium tracking-wider">日圖騰</span>
                        </div>
                    </div>

                    <div class="space-y-1 mb-8">
                        <div class="flex justify-between items-center py-3 border-b border-stone-100">
                            <span class="text-stone-500 font-medium">月份</span>
                            <span class="text-stone-800 font-bold text-lg" id="haab-month"></span>
                        </div>
                        <div class="flex justify-between items-center py-3 border-b border-stone-100">
                            <span class="text-stone-500 font-medium">日期</span>
                            <span class="text-stone-800 font-bold text-lg" id="haab-day"></span>
                        </div>
                        <div class="flex justify-between items-center py-3 border-b border-stone-100">
                            <span class="text-stone-500 font-medium">對應圖騰</span>
                            <span class="text-stone-800 font-bold text-lg" id="haab-glyph"></span>
                        </div>
                    </div>
                    
                    <div class="mt-auto text-center bg-stone-50 p-5 rounded-xl border border-stone-200">
                        <p class="text-xs text-stone-500 mb-1 font-medium tracking-wide">您的哈布曆組合</p>
                        <p class="text-xl font-bold text-stone-800" id="haab-summary"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-stone-400 py-8 border-t border-stone-200 text-sm font-medium">
        <p>© 2026 The Ancient Mayan Calendar | 宇宙法則的探索</p>
    </footer>

    <!-- 核心邏輯腳本 (保留您的原版邏輯與副檔名設定) -->
    <script src="script.js"></script>
</body>
</html>
